else if(s==3)a.innerHTML=`<h2>Зертхананы тексеру</h2><p class="mu">Қауіпсіздік құралдарын табыңыз: өрт сөндіргіш, құм жәшік, өртке қарсы көрпе, алғашқы көмек қобдишасы, тартпа шкаф.</p><div class="fb n">${found.size}/5 қауіпсіздік құралдары табылды</div>${scene(1)}<div class="info" id="in">Объектіні басыңыз.</div>`;
else if(s==4)tf();
else if(s==5)a.innerHTML=`<h2>Химиялық заттармен жұмыс</h2><p class="mu">Әр затты ашып, қауіпті сипатын анықтаңыз (${viewed.size}/6).</p><div class="row">${RG.map((r,k)=>`<button class="ob ${viewed.has(k)?'d':''}" data-r="${k}"><b>${r[0]}</b>${r[1]}</button>`).join("")}</div><div class="info" id="in" style="margin-top:12px">Затты таңдаңыз.</div>`;
else if(s==6)ch(GL,"Шыны ыдыспен жұмыс","Пробиркаға шыны түтікті дұрыс енгізіңіз.");
else if(s==7)ch(FL,"Жанғыш заттармен жұмыс","Бензол, эфир, спирт, ацетон — жанғыш заттар.");
else if(s==8)ch(SP,"Төтенше жағдай: қышқыл төгілді","Дұрыс әрекетті таңдаңыз.");
else if(s==9)ch(FR,"Төтенше жағдай: киім жанды","Секунд сайын маңызды!");
else if(s==10)test();else result();
}
function ok(){return s==0||[0,3,4,5,6,7,8,9,10].includes(s)?(s==0||(s==3?found.size==5:s==4?done[4]>=5:s==5?viewed.size==6:s==10?false:done[s]>0)):(s==1?seen.size>=OB.length:s==2?!!done[2]:true)}
function tf(){const t=TF[i];done[4]=done[4]||0;const a=$("app");
a.innerHTML=`<h2>Дұрыс па, бұрыс па? (${i+1}/5)</h2><div class="big">🧑‍🔬</div><p><b>${t[0]}</b></p><div class="opts"><button data-t="1">✅ Қауіпсіз</button><button data-t="0">⛔ Қауіпті</button></div><div id="fb"></div>`}
let cur=0;
function ch(L,tt,sub){const q=L[cur];const a=$("app");
a.innerHTML=`<h2>${tt}</h2><p class="mu">${sub}${L.length>1?` (${cur+1}/${L.length})`:''}</p><div class="big">${q[0]}</div><p><b>${q[1]}</b></p><div class="opts">${q[2].map((o,k)=>`<button data-c="${k}">${o}</button>`).join("")}</div><div id="fb"></div>${cur<L.length-1&&done["c"+s+cur]?'<button class="pri" id="nq" style="margin-top:10px">Келесі сұрақ</button>':''}`}
function test(){const q=TS[i];$("app").innerHTML=`<h2>Қорытынды тест: ${i+1}/10</h2><p><b>${q[0]}</b></p><div class="opts">${q[1].map((o,k)=>`<button data-q="${k}">${o}</button>`).join("")}</div>`;$("nx").disabled=true}
function result(){const sc=ans.filter((v,k)=>v==TS[k][2]).length;const m=RES.find(r=>sc>=r[0])[1];
$("app").innerHTML=`<div class="big">${sc>=7?'🎓':'📘'}</div><div style="text-align:center"><div class="sc">${sc} / 10</div><h2>${m}</h2></div><div style="text-align:center;margin-top:12px"><button class="pri" id="rs">Қайта бастау</button></div>`}
$("app").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
if(d.k!==undefined){const o=OB[+d.k],n=$("in");
if(s==1){seen.add(+d.k);n.innerHTML=`<b>${o[0]} ${o[1]}.</b> ${o[2]}`;b.classList.add("d");R2()}
else if(o[3]){found.add(+d.k);R();$("in").innerHTML=`<b>${o[0]} ${o[1]}</b> табылды! ${o[2]}`;R2()}
else n.textContent="Бұл қауіпсіздік құралы емес. Іздеуді жалғастырыңыз."}
if(d.g){gear[d.g]=!gear[d.g];R()}
if(b.id=="go"){if(gear.h&&gear.e){done[2]=1;$("fb").innerHTML='<div class="fb g">✅ Қорғаныс құралдары дайын. Тәжірибеге кірісуге болады.</div>';$("nx").disabled=false}else $("fb").innerHTML='<div class="fb b">Қауіпсіздік талаптары сақталмады! Алдымен қорғаныс құралдарын пайдаланыңыз.</div>'}
if(d.t!==undefined){const t=TF[i],c=(+d.t==t[1]);fb(c,(c?"Дұрыс! ":"Қате. ")+t[2]);if(!c)fx("⚠️");else{}
b.classList.add(c?'g':'b');a_tf(c)}
if(d.r!==undefined){const r=RG[+d.r];viewed.add(+d.r);b.classList.add("d");$("in").innerHTML=`<b>${r[0]} ${r[1]}</b><br><span class="tag">Қауіп: ${r[2]}</span><br>Сақтау: ${r[3]}.<br>Абай болу: ${r[4]}.<br>Тартпа шкафта жұмыс жасау: ${r[5]}.`;R2()}
if(d.c!==undefined){const L={6:GL,7:FL,8:SP,9:FR}[s],q=L[cur],c=+d.c==q[3];b.classList.add(c?'g':'b');
$("fb").innerHTML=`<div class="fb ${c?'g':'b'}">${c?'✅':'❌'} ${q[4][+d.c]}</div>`;
if(!c)fx(q[5]);else{done["c"+s+cur]=1;if(cur<L.length-1)$("fb").insertAdjacentHTML("afterend",'<button class="pri" id="nq" style="margin-top:10px">Келесі сұрақ</button>');else{done[s]=1;$("nx").disabled=false}}}
if(d.q!==undefined){ans[i]=+d.q;b.classList.add(+d.q==TS[i][2]?'g':'b');i++;if(i<10)test();else{s=11;R()}}
if(b.id=="nq"){cur++;R()}
if(b.id=="rs"){s=0;i=0;cur=0;done={};seen=new Set();gear={};found=new Set();viewed=new Set();ans=[];R()}});
function R2(){$("nx").disabled=!ok();const p=$("app").querySelector(".mu");if(s==1)p.textContent=`Әр объектіні басып, оның қауіпсіздік ережесін оқыңыз (${seen.size}/${OB.length}).`;if(s==3)$("app").querySelector(".fb").textContent=`${found.size}/5 қауіпсіздік құралдары табылды`;if(s==5)p.textContent=`Әр затты ашып, қауіпті сипатын анықтаңыз (${viewed.size}/6).`}
function fb(c,t){$("fb").innerHTML=`<div class="fb ${c?'g':'b'}">${c?'✅':'❌'} ${t}</div>`}
function a_tf(c){document.querySelectorAll(".opts button").forEach(x=>x.disabled=true);$("fb").insertAdjacentHTML("afterend",`<button class="pri" id="nt" style="margin-top:10px">${i<4?'Келесі жағдай':'Аяқтау'}</button>`);$("nt").onclick=()=>{if(i<4){i++;R()}else{done[4]=5;i=0;$("nx").disabled=false;$("nt").remove()}}}
$("nx").onclick=()=>{if(s==9&&cur>=0)cur=0;s++;i=0;cur=0;R();scrollTo(0,0)};
$("bk").onclick=()=>{s--;i=0;cur=0;R()};
R();
</script></body></html>
